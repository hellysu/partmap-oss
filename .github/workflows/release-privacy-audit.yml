name: Release privacy audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-privacy-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-audit:
    name: Inspect published portable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download latest portable packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'PartMap-Portable-win-*.zip' --dir audit

      - name: Reject private or development files
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for zip in audit/*.zip; do
            echo "Auditing $zip"
            entries="$(unzip -Z1 "$zip")"

            if printf '%s\n' "$entries" | grep -E -i '(^|/)([^/]+\.pdb|[^/]+\.log|[^/]+\.tmp|[^/]+\.lock|[^/]+\.pfx|[^/]+\.snk|\.env(\..*)?|settings[^/]*\.json|PartMap\.product\.json|[^/]+\.3mf)$'; then
              echo "::error::Release package contains a forbidden private/development file."
              found=1
            fi

            if printf '%s\n' "$entries" | grep -E -i '(^|/)products/.+'; then
              echo "::error::Release package contains files inside products/."
              found=1
            fi
          done

          if [ "$found" -ne 0 ]; then
            exit 1
          fi

      - name: Check app binaries for developer user paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          i=0
          for zip in audit/*.zip; do
            dir="extracted/$i"
            mkdir -p "$dir"
            unzip -q "$zip" -d "$dir"
            exe="$(find "$dir" -type f -iname 'PartMap.exe' -print -quit)"
            dll="$(find "$dir" -type f -iname 'PartMap.dll' -print -quit)"
            if [ -z "$exe" ] || [ -z "$dll" ]; then
              echo "::error::PartMap.exe or PartMap.dll not found in $zip"
              exit 1
            fi

            for binary in "$exe" "$dll"; do
              if strings -a "$binary" | grep -E -i '[A-Z]:\\Users\\[^\\]+'; then
                echo "::error::$binary contains an absolute Windows user-profile path."
                exit 1
              fi
              if strings -a "$binary" | grep -E -i '(^|[^A-Za-z])(H|D):\\AI\\'; then
                echo "::error::$binary contains a developer-machine drive path."
                exit 1
              fi
            done

            i=$((i + 1))
          done

  installer-audit:
    name: Install and inspect published installer
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download latest installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path audit | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern 'PartMap-Setup-win-x64-*.exe' --dir audit
          if ($LASTEXITCODE -ne 0) { throw "Failed to download installer." }

      - name: Install into temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem audit -Filter 'PartMap-Setup-win-x64-*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw "Installer asset was not downloaded." }

          $installDir = Join-Path $env:RUNNER_TEMP 'PartMapPrivacyAudit'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$installDir")
          $process = Start-Process -FilePath $installer.FullName -ArgumentList $args -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)." }
          "PARTMAP_AUDIT_INSTALL=$installDir" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Reject private or development files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath $env:PARTMAP_AUDIT_INSTALL -Recurse -File)
          $forbidden = @($files | Where-Object {
            $_.Name -match '(?i)\.pdb$|\.log$|\.tmp$|\.lock$|\.pfx$|\.snk$|^\.env(?:\..*)?$|^settings.*\.json$|^PartMap\.product\.json$|\.3mf$'
          })
          $populatedProducts = @($files | Where-Object {
            $_.FullName -match '(?i)[\\/]products[\\/]'
          })

          if ($forbidden.Count -gt 0 -or $populatedProducts.Count -gt 0) {
            Write-Host "::error::Installer contains forbidden/private files."
            @($forbidden + $populatedProducts) | Sort-Object FullName -Unique | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

      - name: Check installed app for developer user paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binaries = @(
            Get-ChildItem -LiteralPath $env:PARTMAP_AUDIT_INSTALL -Filter PartMap.exe -File -Recurse | Select-Object -First 1
            Get-ChildItem -LiteralPath $env:PARTMAP_AUDIT_INSTALL -Filter PartMap.dll -File -Recurse | Select-Object -First 1
          )
          $binaries = @($binaries | Where-Object { $_ })
          if ($binaries.Count -ne 2) { throw "PartMap.exe or PartMap.dll not found after installation." }

          $patterns = @(
            '(?i)[A-Z]:\\Users\\[^\\\x00\r\n]+',
            '(?i)H:\\AI\\',
            '(?i)D:\\AI\\'
          )

          foreach ($binary in $binaries) {
            $bytes = [System.IO.File]::ReadAllBytes($binary.FullName)
            $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
            $unicode = [System.Text.Encoding]::Unicode.GetString($bytes)

            foreach ($pattern in $patterns) {
              if ($ascii -match $pattern -or $unicode -match $pattern) {
                throw "$($binary.Name) contains a developer-machine path pattern."
              }
            }
          }

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "Installer privacy audit passed."
          Write-Host "No debug symbols, logs, local settings, certificates, model files, populated products folder, or developer-machine path pattern were found."
