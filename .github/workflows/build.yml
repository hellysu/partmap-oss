name: Build Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows packages
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test, strict build, publish and startup smoke
        shell: pwsh
        run: .\verify-development.ps1 -Publish

      - name: Package deliverables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $sha = '${{ github.sha }}'
          $shortSha = $sha.Substring(0, 7)
          Set-Content -LiteralPath artifacts\BUILD-COMMIT.txt -Value $sha -Encoding utf8
          Compress-Archive -Path dist\PartMap-win10-x64 -DestinationPath "artifacts\PartMap-win10-x64-$shortSha.zip" -Force
          Compress-Archive -Path dist\PartMap-win10-x86 -DestinationPath "artifacts\PartMap-win10-x86-$shortSha.zip" -Force

      - name: Upload Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: PartMap-Windows-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
