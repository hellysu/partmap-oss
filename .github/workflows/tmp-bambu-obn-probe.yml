name: tmp-bambu-obn-probe
on:
  push:
    branches:
      - tmp/bambu-obn-probe-build-20260928
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build probe with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /O2 spike\obn_probe.cpp /Fe:obn_probe.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obn-probe-windows-x64
          path: |
            obn_probe.exe
          if-no-files-found: error
          retention-days: 1
