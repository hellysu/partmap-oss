name: tmp-bambu-obn-probe
on:
  push:
    branches:
      - tmp/bambu-obn-probe-build-20260928
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build probe with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC installation not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          Write-Host "Using $vcvars"
          cmd.exe /d /s /c "`"`"$vcvars`" && cl /nologo /std:c++17 /EHsc /O2 spike\obn_probe.cpp /Fe:obn_probe.exe`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: obn-probe-windows-x64
          path: obn_probe.exe
          if-no-files-found: error
          retention-days: 1
